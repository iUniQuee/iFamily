# ⚠️ Cloudflare Pages тохиргоо — Pages зөвхөн root дээрх wrangler.toml-ийг уншина.
# Workers (Sites) хувилбар нь wrangler.workers.jsonc файлд байна.
#   npx wrangler pages dev                                  # локал Pages
#   npx wrangler pages deploy public                        # Pages deploy
name = "ifamily"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "i-family-db"
database_id = "00000000-0000-0000-0000-000000000000"
